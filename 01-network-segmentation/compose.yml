# Stage objective:
# Split the stack into a public network and a private network.
# Public network: Traefik proxy + static front-end.
# Private network: API + MySQL. Traefik is the only bridge between both networks.

name: task03_stage01_network

services:
  traefik:
    image: traefik:v3.5
    command:
      # Docker provider reads routing labels from the Compose services.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://docker-api-proxy:2375
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "8080:80"
      - "8081:8080"
    networks:
      - public
      - private

    depends_on:
      docker-api-proxy:
        condition: service_started
      front:
        condition: service_started
      api:
        condition: service_healthy
  docker-api-proxy:
    image: haproxy:2.9-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-api-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - private
    user: 0:0
  front:
    build:
      context: ./front
    image: task03/front:stage01
    networks:
      # The front-end is public-facing but still reached through Traefik.
      - public

    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`app.localhost`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - traefik.docker.network=task03_stage01_public
  api:
    build:
      context: ./api
    image: task03/api:stage01
    environment:
      INSTANCE_NAME: stage01-api
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      CACHE_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      # The API has no host port and no public network membership.
      - private

    labels:
      - traefik.enable=true
      - traefik.http.routers.backend-api.rule=Host(`api.localhost`)
      - traefik.http.routers.backend-api.entrypoints=web
      - traefik.http.routers.backend-api.service=backend-api
      - traefik.http.services.backend-api.loadbalancer.server.port=8000
      - traefik.docker.network=task03_stage01_private
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      # Database is private-only.
      - private

networks:
  public:
    name: task03_stage01_public
    driver: bridge
  private:
    name: task03_stage01_private
    driver: bridge
    # Internal prevents direct host/internet routing from sensitive services.
    internal: true

volumes:
  mysql_data:
