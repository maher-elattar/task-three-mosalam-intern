# Stage objective:
# Add explicit image versioning for custom components.
# The front-end, API, and database seed image are tagged as v2.

name: task03_stage09_versioning

services:
  traefik:
    image: traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://docker-api-proxy:2375
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.forwardedheaders.insecure=true
      - --entrypoints.websecure.forwardedheaders.insecure=true
      - --entrypoints.metrics.address=:8082
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-ops@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=true
      - --api.insecure=true
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "8080:80"
      - "8443:443"
      - "8081:8080"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
      - letsencrypt:/letsencrypt
    networks:
      - public
      - private

    depends_on:
      docker-api-proxy:
        condition: service_started
      front:
        condition: service_started
      api:
        condition: service_healthy
  docker-api-proxy:
    image: haproxy:2.9-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-api-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - private
    user: 0:0
  front:
    build:
      context: ./front
    image: front:v2
    networks:
      - public

    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`app.localhost`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - traefik.docker.network=task03_stage09_public
  api:
    build:
      context: ./api
    image: api:v2
    environment:
      INSTANCE_NAME: stage09-api
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_ENABLED: "true"
      CACHE_TTL_SECONDS: "30"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private

    labels:
      - traefik.enable=true
      - traefik.http.routers.backend-api.rule=Host(`api.localhost`)
      - traefik.http.routers.backend-api.entrypoints=websecure
      - traefik.http.routers.backend-api.service=backend-api
      - traefik.http.routers.backend-api.tls=true
      - traefik.http.routers.backend-api.middlewares=api-key-auth,api-rate-limit,api-security-headers
      - traefik.http.services.backend-api.loadbalancer.server.port=8000
      - traefik.docker.network=task03_stage09_private
      - traefik.http.middlewares.api-key-auth.forwardauth.address=http://auth:8000/auth
      - traefik.http.middlewares.api-key-auth.forwardauth.trustforwardheader=true
      - traefik.http.middlewares.api-key-auth.forwardauth.authresponseheaders=X-Authenticated-By
      - traefik.http.middlewares.api-rate-limit.ratelimit.average=5
      - traefik.http.middlewares.api-rate-limit.ratelimit.period=1s
      - traefik.http.middlewares.api-rate-limit.ratelimit.burst=10
      - traefik.http.middlewares.api-security-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.api-security-headers.headers.browserxssfilter=true
      - traefik.http.middlewares.api-security-headers.headers.stsseconds=31536000
  auth:
    build:
      context: ./api
    image: api:v2
    environment:
      INSTANCE_NAME: stage09-auth
      API_KEY: ${API_KEY:-lab-secret-key}
      BLOCKED_IPS: "203.0.113.10,198.51.100.7"
      CACHE_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private

  mysql:
    build:
      context: ./db
    image: db:v2
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - private

  backup:
    image: mysql:8.4
    command: ["sh", "/backup/backup-loop.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      # Short interval for local testing. Use a real cron schedule in production.
      BACKUP_INTERVAL_SECONDS: "30"
      INIT_BACKUP: "true"
    volumes:
      - ./backup/backup-loop.sh:/backup/backup-loop.sh:ro
      - db_backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - private

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - ops

  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    user: "0:0"
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - ops

  grafana:
    image: grafana/grafana:10.4.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3300:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - ops

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
    networks:
      - private
      - ops

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - ops

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - ops

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - ops

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    command: ["--config.my-cnf=/etc/mysql-exporter/.my.cnf"]
    volumes:
      - ./observability/mysql-exporter/.my.cnf:/etc/mysql-exporter/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - private
      - ops

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - private
      - ops

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    ports:
      - "9115:9115"
    extra_hosts:
      - "api.localhost:host-gateway"
      - "app.localhost:host-gateway"
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - ops

networks:
  public:
    name: task03_stage09_public
    driver: bridge
  private:
    name: task03_stage09_private
    driver: bridge
    internal: true
  ops:
    name: task03_stage09_ops
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  letsencrypt:
  loki_data:
  grafana_data:
  db_backups:
  prometheus_data:
  alertmanager_data:
