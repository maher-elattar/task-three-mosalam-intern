# Minimal Alertmanager configuration.
# It keeps alerts visible in the Alertmanager UI without requiring external email or Slack secrets.

global:
  resolve_timeout: 1m

route:
  receiver: lab-console
  group_by: ["alertname", "job"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 5m

receivers:
  - name: lab-console

