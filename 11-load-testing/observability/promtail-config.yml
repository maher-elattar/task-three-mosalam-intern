# Promtail ships Docker JSON log files to Loki.
# This uses file scraping instead of Docker API discovery so it works on daemons that reject older Docker API clients.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-json-logs
    static_configs:
      - targets: ["localhost"]
        labels:
          job: docker-json-logs
          project: task03_stage11_loadtest
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
