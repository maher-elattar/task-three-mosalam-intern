# HAProxy TCP proxy for MySQL failover.
# Primary receives traffic while healthy. Standby is marked as backup and used only when primary fails.

global
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 3s
  timeout client 30s
  timeout server 30s

listen stats
  bind *:8404
  mode http
  stats enable
  stats uri /stats
  stats refresh 5s

listen mysql
  bind *:3306
  mode tcp
  option tcp-check
  default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions
  server mysql-primary mysql-primary:3306 check
  server mysql-standby mysql-standby:3306 check backup

