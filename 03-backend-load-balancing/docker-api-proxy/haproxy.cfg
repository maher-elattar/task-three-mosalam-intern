# Docker API compatibility proxy for Traefik Docker discovery.
# This daemon rejects old /v1.24 client paths, so requests are rewritten to /v1.40.

global
  log stdout format raw local0
  maxconn 128

defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client 1h
  timeout server 1h

frontend docker_api
  bind *:2375
  http-request replace-path ^/v[0-9.]+/(.*)$ /v1.40/\1
  default_backend docker_socket

backend docker_socket
  server docker /var/run/docker.sock
