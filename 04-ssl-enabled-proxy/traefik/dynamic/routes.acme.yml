# Production ACME variant.
# Mount this over routes.yml with compose.acme.yml after real DNS points to the host.

http:
  routers:
    frontend:
      rule: Host(`app.localhost`)
      entryPoints: [websecure]
      service: frontend
      tls:
        certResolver: letsencrypt
    api:
      rule: Host(`api.localhost`)
      entryPoints: [websecure]
      service: api
      tls:
        certResolver: letsencrypt

  services:
    frontend:
      loadBalancer:
        servers:
          - url: http://front:80
    api:
      loadBalancer:
        servers:
          - url: http://task03_stage04_ssl-api-1:8000
          - url: http://task03_stage04_ssl-api-2:8000

