# Active HTTPS routes for local testing.
# The TLS certificate comes from tls.yml and scripts/generate-local-certs.sh.

http:
  routers:
    frontend:
      rule: Host(`app.localhost`)
      entryPoints: [websecure]
      service: frontend
      tls: {}
    api:
      rule: Host(`api.localhost`)
      entryPoints: [websecure]
      service: api
      tls: {}

  services:
    frontend:
      loadBalancer:
        servers:
          - url: http://front:80
    api:
      loadBalancer:
        servers:
          - url: http://task03_stage04_ssl-api-1:8000
          - url: http://task03_stage04_ssl-api-2:8000

