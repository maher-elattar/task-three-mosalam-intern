# Blackbox exporter module for HTTPS checks.
# insecure_skip_verify is used because the local lab certificate is self-signed.

modules:
  https_2xx_insecure:
    prober: http
    timeout: 5s
    http:
      method: GET
      headers:
        X-API-Key: intern-secret-key
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      tls_config:
        insecure_skip_verify: true

