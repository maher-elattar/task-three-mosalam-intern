# Prometheus scrape configuration.
# Prometheus joins both the private app network and the ops network so it can scrape app targets and observability targets.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: api
    dns_sd_configs:
      # Docker DNS returns the API replicas so Prometheus can scrape each backend.
      - names: ["api"]
        type: A
        port: 8000

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: blackbox-ssl
    metrics_path: /probe
    params:
      module: [https_2xx_insecure]
    static_configs:
      - targets:
          - https://api.localhost:8443/api/items
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

